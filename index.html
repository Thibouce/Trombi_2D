<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Trombi 2D — Expérience immersive 360°</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Scène 3D (panorama 360 + tête intégrée) -->
    <canvas id="scene"></canvas>

    <!-- Interface superposée -->
    <div id="ui">
      <header class="topbar">
        <h1>Trombi&nbsp;2D</h1>
        <p class="subtitle">Prends-toi en photo, entre dans nos locaux.</p>
      </header>

      <!-- Panneau de capture webcam -->
      <section id="capture-panel" class="panel hidden">
        <div class="capture-stage">
          <video id="webcam" autoplay playsinline muted></video>
          <div class="face-guide"></div>
          <canvas id="capture-canvas" class="hidden"></canvas>
        </div>
        <div class="capture-actions">
          <button id="shoot-btn" class="btn btn-primary">📸 Prendre la photo</button>
          <button id="retake-btn" class="btn hidden">↺ Reprendre</button>
          <button id="add-btn" class="btn btn-primary hidden">➕ Ajouter à la liste</button>
          <button id="capture-cancel" class="btn btn-ghost">Fermer</button>
        </div>
        <p class="hint">Solo : intégration immédiate. Groupé : ajoute plusieurs visages puis « ✨ Intégrer » 🙂</p>
      </section>

      <!-- Liste des personnes à intégrer (miniatures) -->
      <section id="roster" class="roster hidden">
        <span class="roster-label">Personnes à intégrer</span>
        <div id="roster-list" class="roster-list"></div>
      </section>

      <!-- Barre d'actions principale -->
      <footer class="bottombar">
        <button id="mode-btn" class="btn btn-ghost" title="Basculer entre intégration Solo et Groupée">👤 Solo</button>
        <button id="open-capture" class="btn btn-primary">🙂 Me prendre en photo</button>
        <label class="btn btn-primary" title="Importer une image de visage (pratique pour tester)">
          🖼️ Importer un visage
          <input id="face-input" type="file" accept="image/*" hidden />
        </label>
        <button id="integrate-btn" class="btn btn-primary" disabled>✨ Intégrer</button>
        <label class="btn btn-ghost" title="Charger ta propre photo 360° équirectangulaire">
          🌐 Charger un panorama
          <input id="pano-input" type="file" accept="image/*" hidden />
        </label>
        <button id="autotour-btn" class="btn btn-ghost" aria-pressed="true">⏸ Tour auto</button>
        <button id="reset-btn" class="btn btn-ghost" title="Revenir au panorama d'origine">↺ Réinitialiser</button>
      </footer>
    </div>

    <div id="loader" class="loader hidden"><div class="spinner"></div><span></span></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
