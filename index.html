<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Trombi 2D — Expérience immersive 360°</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body data-stage="hub">
    <!-- Étape 1 : hub 3D (Gaussian Splat des locaux) -->
    <canvas id="hub"></canvas>
    <!-- Étape 2 : panorama 360 (une fois un style choisi) -->
    <canvas id="scene"></canvas>

    <!-- Interface superposée -->
    <div id="ui">
      <header class="topbar">
        <h1>Trombi&nbsp;2D</h1>
        <p class="subtitle" id="subtitle">Explore les locaux et clique sur ton bureau 🖱️</p>
      </header>

      <!-- Aide du hub (étape 1) -->
      <section id="hub-ui" class="hub-ui">
        <p class="hub-hint">Fais tourner les locaux et clique sur un point 🔵 pour choisir ton décor.</p>
        <button id="enter-fallback" class="btn btn-ghost" title="Ouvrir le choix des styles sans passer par la 3D">Entrer sans la 3D →</button>
      </section>

      <!-- Panneau de capture webcam (étape 2) -->
      <section id="capture-panel" class="panel hidden">
        <div class="capture-stage">
          <video id="webcam" autoplay playsinline muted></video>
          <div class="face-guide"></div>
          <canvas id="capture-canvas" class="hidden"></canvas>
        </div>
        <div class="capture-actions">
          <button id="shoot-btn" class="btn btn-primary">📸 Prendre la photo</button>
          <button id="retake-btn" class="btn hidden">↺ Reprendre</button>
          <button id="place-btn" class="btn btn-primary hidden">✨ M'intégrer dans la scène</button>
          <button id="capture-cancel" class="btn btn-ghost">Fermer</button>
        </div>
        <p class="hint">Cadre bien ta tête dans l'ovale, souris 🙂 — l'IA t'intègre ensuite dans les locaux.</p>
      </section>

      <!-- Choix des styles (modale, ouverte au clic sur un point) -->
      <section id="style-modal" class="panel style-modal hidden">
        <h2 class="modal-title">Choisis ton décor</h2>
        <div id="style-picker" class="style-picker"></div>
        <button id="style-cancel" class="btn btn-ghost">Annuler</button>
      </section>

      <!-- Barre d'actions (étape 2 : panorama) -->
      <footer class="bottombar">
        <button id="back-hub" class="btn btn-ghost" title="Revenir aux locaux (3D)">← Locaux</button>
        <button id="open-capture" class="btn btn-primary">🙂 Me prendre en photo</button>
        <label class="btn btn-primary" title="Importer une image de visage (pratique pour tester)">
          🖼️ Importer un visage
          <input id="face-input" type="file" accept="image/*" hidden />
        </label>
        <button id="download-btn" class="btn btn-ghost" title="Télécharger le panorama résultat" disabled>⬇️ Télécharger</button>
        <button id="autotour-btn" class="btn btn-ghost" aria-pressed="true">⏸ Tour auto</button>
        <button id="reset-btn" class="btn btn-ghost" title="Revenir au décor d'origine">↺ Réinitialiser</button>
      </footer>
    </div>

    <div id="loader" class="loader hidden"><div class="spinner"></div><span></span></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
